<!DOCTYPE html>
<html>

<head>
  <title>Smart Bin Dashboard</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>  

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 100%;
      height: auto;
      margin: 10px auto;
      padding: 10px;
      box-sizing: border-box;
      max-height: 100vh;
    }

    #result {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      flex-wrap: wrap;
    }



    .card {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      justify-content: center;
      max-height: fit-content;
    }

    .card1 {
      border: 1px solid #ddd;
      border-radius: 5px;
      margin: 15px;
      /* Increased margin for spacing */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      justify-content: center;
      height: 60vh;
    }

    .card2 {
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-top: 15px;
      /* Increased margin for spacing */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      justify-content: center;
      max-height: 70vh;
      height: 60vh;
      width: 100%;
    }

    .card3 {
      border: none;
      /* Remove border to blend with card2 */
      padding: 10px;
      /* Increased padding for better spacing */
      margin-top: 10px;
      /* Added margin for spacing */
      box-shadow: none;
      /* Remove shadow for cleaner look */
    }

    .card4 {
      border: 1px solid #ddd;
      border-radius: 5px;

      margin: 15px;
      /* Increased margin for spacing */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      flex-direction: column;
      justify-content: center;
      width: 93%;
      height: 60vh;
    }

    .card5 {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 5px;
      margin: 15px;
      /* Increased margin for spacing */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      justify-content: center;
    }

    .card6 {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 5px;
      margin: 15px;
      /* Increased margin for spacing */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      justify-content: center;
      max-height: 20vh;
      overflow-y: scroll;
    }

    .card-header {
      background-color: #f0f0f0;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      display: flex;
      justify-content: center;
    }

    .header {
      background-color: #f0f0f0;
      padding: 5px;
      /* Reduced padding for a smaller height */
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      font-size: 14px;
      /* Optional: Adjust font size if needed */
    }

    .chart-container {
      width: 100%;
      height: 55vh;
    }

    .bin-icon {
      max-width: 100%;
      height: 20vh;
    }

    .cleanliness-options {
      display: flex;
      flex-direction: row;
      margin-top: 15px;
      margin-bottom: 15px;
      justify-content: space-between;
      font-size: 30px;
    }

    .cleanliness-option {
      display: flex;
      justify-content: space-evenly;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 5px;
      transition: background-color 0.3s;
      font-size: 20px;
      font-weight: normal;
    }

    .cleanliness-options.highlight {
      background-color: #17b970;
    }

    .current-status {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .status-item {
      text-align: left;
      margin: 10px;
    }

    @media (max-width: 200px) {
      .bin-icon {
        height: 15vh;
        /* Adjust height for smaller screens */
      }
    }

    @media (max-width: 200px) {

      .card,
      .card1,
      .card2,
      .card3,
      .card4,
      .card5,
      .card-header,
      .row {
        margin: 10px 10px;
      }

      .current-status {
        flex-direction: column;
        align-items: center;
      }

      .status-item {
        text-align: center;
      }
    }

    .span {
      display: flex;
    }

    /* Style for clear data button */
    .btn-clear {
      margin-top: 10px;
    }

    .buttons {
      border: none;
      background-color: #CFFBE2;
      height: 50px;
      width: 50px;
      border-radius: 22px;
      transition: background-color 0.3s;
    }

    .bin_buttons {
      border: none;
      background-color: #CFFBE2;
      height: 40px;
      min-width: 100%;
      border-radius: 22px;
      transition: background-color 0.3s;
      margin-bottom: 10px;
      margin-top: 5px;
    }

    .buttons.highlight {
      background-color: #005964;
    }

    .bins-switching {
      display: flex;
      justify-content: space-between;
      width: 100%;
      flex-direction: column;
      font-size: 20px;
    }

    #create-bin-button {
      margin-top: 20px;
      border: none;
      background-color: #dc3545;
      color: white;
      border-radius: 5px;
      padding: 10px;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    #create-bin-button:hover {
      background-color: #942732;
    }

    .time-input-container {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px 0;
}

.time-input-container input {
  border: 1px solid #ccc;
  border-radius: 5px;
  padding: 5px;
  font-size: 16px;
  margin-right: 10px;
  transition: border-color 0.3s;
}

.time-input-container input:focus {
  border-color: #007bff;
  outline: none;
}

.time-input-container select {
  border: 1px solid #ccc;
  border-radius: 5px;
  padding: 5px;
  font-size: 16px;
  margin-right: 10px; /* Space between dropdown and button */
  transition: border-color 0.3s;
}

.time-input-container select:focus {
  border-color: #007bff;
  outline: none;
}

.time-input-container button {
  background-color: #007bff; /* Blue background */
  color: white; /* White text */
  border: none; /* No border */
  border-radius: 5px; /* Rounded corners */
  padding: 8px 15px; /* Padding for button */
  font-size: 16px; /* Font size */
  cursor: pointer; /* Pointer cursor on hover */
  transition: background-color 0.3s; /* Transition for background color */
}

.time-input-container button:hover {
  background-color: #0056b3; /* Darker blue on hover */
}

.time-input-container button:active {
  background-color: #004494; /* Even darker blue when pressed */
}

  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      Smart Bin
    </div>
    <div class="row">
      <div class="col 1fr " style="padding: 0px;">
        <div class="card1">
          <div class="header">
            Bin level %
          </div>
          <div class="chart-container">
            <canvas id="binLevelChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col 1fr justify-content-center" style="padding: 0px;">
        <div class="card2">
          <img
            src="https://img.freepik.com/free-vector/blue-trash-can-with-lid-ecology-sign-green-leaves-background_1268-15043.jpg?t=st=1727670209~exp=1727673809~hmac=878afe587235143840375022778aa90f633bd4b9c2e022acc53b9817a9b66ca7&w=1060"
            alt="Bin Icon" class="bin-icon">

          <div class="card3">
            <div class="header">
              Current Condition
            </div>
            <div class="card-body">
              <p>
                <span id="current-level"></span>
              </p>
              <button class="btn btn-danger btn-clear" id="clear-data-button">Clear Data</button>
              <p></p>

              <div class="header">
                Set Data Request Time:
              </div>
              <p></p>
              <div id="result" style="margin-top: 10px;">set the countdown time to prepare for deep sleep </div>
              <!-- Result placeholder -->
              <div class="time-input-container">
                <input type="number" id="request-hours" min="1" max="12" placeholder="HH" style="width: 50px;">
                :
                <input type="number" id="request-minutes" min="0" max="59" placeholder="MM" style="width: 50px;">
                <select id="request-am-pm">
                  <option value="AM">AM</option>
                  <option value="PM">PM</option>
                </select>
                <button class="btn btn-primary" id="set-time-button">Set Time</button>
              </div>


            </div> <!-- End of card-body -->
          </div> <!-- End of card3 -->
        </div> <!-- End of card2 -->
      </div> <!-- End of column -->
      <div class="col 1fr justify-content-center" style="padding: 0px;">
        <div class="card4">

          <div class="card5">
            <div class="card-header">
              Bin cleanness
            </div>

            <div class="cleanliness-options">

              <button class="buttons" id="cleanliness-dirty"></button>
              <span>Dirty</span>



              <button class="buttons" id="cleanliness-clean"></button>
              <span>Clean</span>


            </div>
          </div>


          <div class="card-header">
            Bins
          </div>
          <div class="card6" title="Bins">
            <div class="col 1fr  justify-content-center  ">

              <div class="bins-switching">
              </div>
            </div>
          </div>

          <!--  <button id="create-bin-button">Create New Bin</button> -->

        </div>
      </div>
    </div>


    <p>Design By: Tharapi Myo</p>
    <script>
      $(document).ready(function () {
        var binLevelChartCtx = document.getElementById('binLevelChart').getContext('2d');
        var chart = new Chart(binLevelChartCtx, {
          type: 'line',
          data: {
            labels: [],
            datasets: [{
              label: 'Bin Level',
              data: [],
              backgroundColor: 'rgba(54, 162, 235, 0.2)',
              borderColor: 'rgba(54, 162, 235, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true
              }
            },
            plugins: {
              legend: {
                display: false
              }
            }
          }
        });

        var socket;
        var heartbeatInterval;
        var heartbeatTimeout;
        var reconnectDelay = 3000; // 1 second
        var currentBinID = null; // Variable to track the currently selected bin
        initWebSocket();
        function initWebSocket() {
          // Initialize a WebSocket connection to the ESP32 server
          socket = new WebSocket('ws://esp32.local:8080'); // Ensure to use 'ws://' for WebSocket

          // Event handler for when the connection is opened
          socket.onopen = function () {
            console.log("WebSocket connection opened");
            sendHeartbeat(); // Start sending heartbeat messages
            // Send the saved target time to ESP32 if it exists
            const savedTime = localStorage.getItem('targetTime');
            if (savedTime) {
              socket.send(JSON.stringify({ type: "setTime", time: savedTime }));
            }
          };

          // Event handler for receiving messages
          socket.onmessage = function (event) {
            // Check if the message is a connection acknowledgment
            if (event.data === "Connected") {
              clearTimeout(heartbeatTimeout);
              sendHeartbeat(); // Send the heartbeat
              // Check if the message requests remaining time

            }
            else {
              try {
                // Parse the incoming message
                const message = JSON.parse(event.data);
                console.log('Message received:', event.data);
                // Get current timestamp
                const now = new Date();
                const date = now.toLocaleDateString('en-GB');
                const time = now.toLocaleTimeString('en-GB', {
                  hour: '2-digit',
                  minute: "2-digit",
                  hour12: true
                }).replace(':', '.');
                const timestamp = `${date} ${time}`;
                if (message["type"] === "request_remaining_time") {
                  sendRemainingTime(); // Call function to send remaining time when requested
                }
                else {
                  // Extract values from the message
                  const value = parseFloat(message["bin level"]);
                  const modelPrediction = message["model prediction"]; // Fix the key according to your JSON structure
                  const ID = message["bin Location"]; // Fix the key according to your JSON structure

                  // Save data for the specific bin ID
                  saveDataToLocalStorage(timestamp, value, ID, modelPrediction);

                  // Automatically create a button if it doesn't exist for the new bin
                  createOrUpdateBinButton(ID);

                  // Only update the chart if the current bin ID matches the new data's ID
                  if (ID === currentBinID) {
                    updateChart(ID, value);
                    updateCleanlinessOptions(ID);
                  }
                }
              } catch (error) {
                console.log("Error parsing JSON message: " + error.message);
              }
            }
          };

          // Event handler for when the connection is closed
          socket.onclose = function () {
            console.log("WebSocket connection closed, reconnecting...");
            setTimeout(initWebSocket, reconnectDelay); // Attempt to reconnect after a delay
          };

          // Event handler for errors
          socket.onerror = function (error) {
            console.log("WebSocket error: " + error.message);
          };
        }

        // Function to send a heartbeat message to the server
        function sendHeartbeat() {
          if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "heartbeat" }));

            heartbeatTimeout = setTimeout(function () {
              console.log("Heartbeat timeout, reconnecting...");
              socket.close(); // Close the socket to trigger the onclose event
            }, 5000); // Wait 5 seconds for the acknowledgment
          }
        }

        function saveDataToLocalStorage(timestamp, value, ID, model_prediction) {
          try {
            var binData = JSON.parse(localStorage.getItem(`binData_${ID}`)) || { labels: [], values: [] };
            var model_prediction_saved = JSON.parse(localStorage.getItem(`model_prediction_${ID}`)) || { latest: null };

            if (binData.labels.length >= 10) {
              binData.labels.shift();
              binData.values.shift();
            }

            binData.labels.push(timestamp);
            binData.values.push(value);

            model_prediction_saved.latest = model_prediction;

            localStorage.setItem(`binData_${ID}`, JSON.stringify(binData));
            localStorage.setItem(`model_prediction_${ID}`, JSON.stringify(model_prediction_saved));
          } catch (error) {
            console.log("Error saving data to localStorage: " + error.message);
          }
        }

        function updateChart(ID) {
          var binData = JSON.parse(localStorage.getItem(`binData_${ID}`)) || { labels: [], values: [] };

          if (chart) {
            chart.data.labels = binData.labels;
            chart.data.datasets[0].data = binData.values;
            chart.update();
          }

          $('#current-level').text("Current level for bin " + ID + ": " + binData.values[binData.values.length - 1] + "%" || 'N/A');
        }

        function updateCleanlinessOptions(ID) {
          var model_prediction_data = JSON.parse(localStorage.getItem(`model_prediction_${ID}`)) || { latest: null };
          var model_prediction = model_prediction_data.latest;

          $('.buttons').removeClass('highlight');

          if (model_prediction === "clean") {
            $('#cleanliness-clean').addClass('highlight');
          } else if (model_prediction === "dirty") {
            $('#cleanliness-dirty').addClass('highlight');
          }
        }

        function createOrUpdateBinButton(ID) {
          const binsSwitching = document.querySelector('.bins-switching');

          // Check if button for this bin already exists
          let binButton = document.querySelector(`.bins-switching button[data-id="${ID}"]`);

          if (!binButton) {
            // If the button doesn't exist, create a new one
            binButton = document.createElement('button');
            binButton.classList.add('bin_buttons');
            binButton.setAttribute('data-id', ID);
            binButton.textContent = `Bin ${ID}`; // Display bin ID
            binsSwitching.appendChild(binButton);

            // Add click event to update the chart for this bin
            binButton.addEventListener('click', function () {
              currentBinID = ID; // Set the current bin ID
              updateChart(ID); // Update chart data for this bin
              updateCleanlinessOptions(ID); // Highlight cleanliness options for this bin
            });

            // Save the new bin ID to localStorage
            let savedBins = JSON.parse(localStorage.getItem('bins')) || [];
            if (!savedBins.includes(ID)) {
              savedBins.push(ID);
              localStorage.setItem('bins', JSON.stringify(savedBins));
            }
          }

          // Sort the buttons after adding/updating
          sortBinButtons();
        }

        function sortBinButtons() {
          const binsSwitching = $('.bins-switching');
          const binButtons = $('.bin_buttons').sort((a, b) => {
            return parseInt($(a).data('id')) - parseInt($(b).data('id'));
          });

          // Clear the current container and append the sorted buttons
          binsSwitching.empty();
          binButtons.each(function () {
            binsSwitching.append($(this));
          });
        }


        $('#clear-data-button').on('click', function () {
          localStorage.clear();
          targetTime = null;
          document.getElementById("result").innerText = "Target time cleared.";
          // Reset any countdown or UI elements related to time
          clearInterval(timerInterval); // Stop any running timers
          $('.buttons').removeClass('highlight');
          $('.bins-switching').empty();
          chart.data.labels = [];
          chart.data.datasets[0].data = [];
          chart.update();
          currentBinID = null;
          $('#current-level').text(" ");
        });



        // Load saved bins from localStorage on page load
        const savedBins = JSON.parse(localStorage.getItem('bins')) || [];
        if (savedBins.length > 0) {
          savedBins.forEach((binID) => {
            createOrUpdateBinButton(binID);
          });

          const firstBinID = savedBins[0];
          currentBinID = firstBinID;
          updateChart(firstBinID);
          updateCleanlinessOptions(firstBinID);
        } else {
          console.log("No bins saved in localStorage.");
        }
        let timerInterval; // Variable to hold the timer interval
        let targetTime; // Variable to hold the target time

        // Set time and save it to local storage
        document.getElementById("set-time-button").addEventListener("click", function () {
          const now = new Date();
          const hours = parseInt(document.getElementById("request-hours").value);
          const minutes = parseInt(document.getElementById("request-minutes").value);
          const amPm = document.getElementById("request-am-pm").value;

          // Convert hours to 24-hour format based on AM/PM selection
          let adjustedHours = hours;
          if (amPm === 'PM' && hours < 12) {
            adjustedHours += 12; // Convert PM hour to 24-hour format
          } else if (amPm === 'AM' && hours === 12) {
            adjustedHours = 0; // Midnight case
          }

          // Create the target time with adjusted hours
          targetTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), adjustedHours, minutes, 0);

          if (targetTime <= now) {
            targetTime.setDate(targetTime.getDate() + 1); // Set to the next day if time has already passed
          }

          // Save the target time to local storage
          localStorage.setItem('targetTime', targetTime.toISOString());

          clearInterval(timerInterval);
          timerInterval = setInterval(updateRemainingTime, 1000);
          updateRemainingTime(); // Initial call to display time immediately
        });
        // Function to update remaining time
        function updateRemainingTime() {
          const now = new Date();
          const remainingTimeInMillis = new Date(localStorage.getItem('targetTime')) - now;

          if (remainingTimeInMillis < 0) {
            clearInterval(timerInterval);
            document.getElementById("result").innerText = "The target time has passed.";

            // Set the target time to the same hour and minute the next day
            targetTime.setDate(targetTime.getDate() + 1); // Move to the next day
            localStorage.setItem('targetTime', targetTime.toISOString()); // Save the new target time

            // Restart the countdown with the new target time
            updateRemainingTime();
            timerInterval = setInterval(updateRemainingTime, 1000);
            return;
          }

          const hoursRemaining = Math.floor((remainingTimeInMillis % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutesRemaining = Math.floor((remainingTimeInMillis % (1000 * 60 * 60)) / (1000 * 60));
          const secondsRemaining = Math.floor((remainingTimeInMillis % (1000 * 60)) / 1000);

          // Get exact hour in AM/PM format
          const targetDate = new Date(localStorage.getItem('targetTime'));
          const exactHour = targetDate.getHours();
          const exactMinutes = targetDate.getMinutes();
          const amPm = exactHour >= 12 ? 'PM' : 'AM';
          const formattedHour = exactHour % 12 === 0 ? 12 : exactHour % 12; // Convert to 12-hour format

          // Ensure two-digit formatting for minutes
          const formattedMinutes = exactMinutes < 10 ? `0${exactMinutes}` : exactMinutes;

          // Display remaining time with formatted hour
          document.getElementById("result").innerText = `Remaining time: ${hoursRemaining} hours, ${minutesRemaining} minutes, and ${secondsRemaining} seconds until next data. (Target: ${formattedHour}:${formattedMinutes} ${amPm})`;

        }

        // Load saved time from localStorage on page load
        window.onload = function () {
          const savedTime = localStorage.getItem('targetTime');

          if (savedTime) {
            targetTime = new Date(savedTime);
            if (targetTime > new Date()) {
              updateRemainingTime(); // Display the countdown immediately
              timerInterval = setInterval(updateRemainingTime, 1000); // Start the interval
            } else {
              document.getElementById("result").innerText = "The saved target time has passed.";
            }
          }
        };

        // Function to send remaining time to ESP32
        function sendRemainingTime() {
          const savedTime = localStorage.getItem('targetTime');
          const now = new Date();

          if (savedTime) {
            const targetTime = new Date(savedTime);
            const remainingTimeInMillis = targetTime - now;

            if (remainingTimeInMillis < 0) {
              console.log("The target time has passed. No remaining time to send.");
              return;
            }

            const remainingTimeInMicroseconds = remainingTimeInMillis * 1000; // Convert to microseconds

            // Send remaining time to ESP32 via WebSocket
            if (socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ type: "set_remaining_time", remainingTime: remainingTimeInMicroseconds }));
              console.log(`Remaining time sent: ${remainingTimeInMicroseconds} microseconds`);
            }
          } else {
            console.log("No saved target time found.");
          }
        }

      });

    </script>
</body>

</html>
